# GoReleaser configuration for go-crap
# https://goreleaser.com

version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    - go mod download

builds:
  - main: ./main.go
    binary: go-crap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/padiazg/go-crap/pkg/version.version={{.Version}}
      - -X github.com/padiazg/go-crap/pkg/version.commit={{.Commit}}
      - -X github.com/padiazg/go-crap/pkg/version.buildDate={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Enhancements'
      regexp: '^.*?enhance(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: padiazg
    name: go-crap
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## go-crap {{ .Tag }} Release

    go-crap a CLI tool that calculates the CRAP score for Go projects.

    ### Installation

    Download the appropriate binary for your platform below, or:

    Install the pre-built binary with version info stamped via ldflags:
    ```shell
    curl -fsSL https://padiazg.github.io/go-crap/install.sh | sh
    ```
    
    Or install from source:
    ```shell
    go install github.com/padiazg/go-crap@{{ .Tag }}
    ```
    
    use Homebrew
    ```shell
    brew tap padiazg/go-crap 
    brew install go-crap
    ```

  footer: |
    **Full Changelog**: https://github.com/padiazg/go-crap/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

# Docker images (multi-arch via buildx)
dockers:
  - image_templates:
      - "docker.io/padiazg/go-crap:{{ .Tag }}-amd64"
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title=go-crap
      - --label=org.opencontainers.image.description=CRAP score calculator for Go projects
      - --label=org.opencontainers.image.url=https://padiazg.github.io/go-crap
      - --label=org.opencontainers.image.source=https://github.com/padiazg/go-crap
      - --label=org.opencontainers.image.version={{ .Tag }}
      - --label=org.opencontainers.image.created={{ .Date }}
    goarch: amd64
  - image_templates:
      - "docker.io/padiazg/go-crap:{{ .Tag }}-arm64"
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title=go-crap
      - --label=org.opencontainers.image.description=CRAP score calculator for Go projects
      - --label=org.opencontainers.image.url=https://padiazg.github.io/go-crap
      - --label=org.opencontainers.image.source=https://github.com/padiazg/go-crap
      - --label=org.opencontainers.image.version={{ .Tag }}
      - --label=org.opencontainers.image.created={{ .Date }}
    goarch: arm64

docker_manifests:
  - name_template: "docker.io/padiazg/go-crap:{{ .Tag }}"
    image_templates:
      - "docker.io/padiazg/go-crap:{{ .Tag }}-amd64"
      - "docker.io/padiazg/go-crap:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/padiazg/go-crap:{{ .Tag }}"
    image_templates:
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-amd64"
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-arm64"
  - name_template: "docker.io/padiazg/go-crap:latest"
    image_templates:
      - "docker.io/padiazg/go-crap:{{ .Tag }}-amd64"
      - "docker.io/padiazg/go-crap:{{ .Tag }}-arm64"
    skip_push: auto
  - name_template: "ghcr.io/padiazg/go-crap:latest"
    image_templates:
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-amd64"
      - "ghcr.io/padiazg/go-crap:{{ .Tag }}-arm64"
    skip_push: auto

# Homebrew configuration (GoReleaser v2 format)
# To publish to Homebrew, create a tap repository at github.com/padiazg/homebrew-go-crap
brews:
  - name: go-crap
    repository:
      owner: padiazg
      name: homebrew-go-crap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      
    homepage: https://github.com/padiazg/go-crap
    description: go-crap a CLI tool that calculates the CRAP score for Go projects
    license: MIT
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"